name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate env.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          STORAGE_PROVIDER: ${{ secrets.STORAGE_PROVIDER }}
          STORJ_UPLOAD_URL: ${{ secrets.STORJ_UPLOAD_URL }}
        run: node scripts/generate-env.js

      - name: Deploy Supabase Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          npx supabase@latest functions deploy upload-kyc --project-ref $SUPABASE_PROJECT_ID
          npx supabase@latest secrets set \
            STORJ_ENDPOINT=${{ secrets.STORJ_ENDPOINT }} \
            STORJ_ACCESS_KEY=${{ secrets.STORJ_ACCESS_KEY }} \
            STORJ_SECRET_KEY=${{ secrets.STORJ_SECRET_KEY }} \
            STORJ_BUCKET=${{ secrets.STORJ_BUCKET }} \
            --project-ref $SUPABASE_PROJECT_ID

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/public
          force_orphan: true
